services:
  - type: web
    name: brand-analysis-suite
    env: node
    plan: free
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=./.cache/ms-playwright npm install && PLAYWRIGHT_BROWSERS_PATH=./.cache/ms-playwright npx playwright install chromium
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: ./.cache/ms-playwright
